name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
        run: |
          rm -rf dist tsconfig.tsbuildinfo
          npm run build

      - name: Check dist outputs
        run: |
          test -f dist/main.js
          echo "Build OK — main.js present"
