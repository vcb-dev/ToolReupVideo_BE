name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker_push:
        description: 'Chỉ redeploy Railway (không build/push Docker)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

env:
  IMAGE: viejhaf/toolreup-video-be:latest

jobs:
  migrate:
    name: DB migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Thiếu GitHub secret DATABASE_URL"
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            export DIRECT_URL="$(node -e '
              const u = process.env.DATABASE_URL;
              try {
                const x = new URL(u);
                if (x.port === "6543") x.port = "5432";
                x.searchParams.delete("pgbouncer");
                x.searchParams.delete("connection_limit");
                process.stdout.write(x.toString());
              } catch {
                process.stdout.write(u);
              }
            ')"
            echo "DIRECT_URL không có secret — dùng bản derive từ DATABASE_URL"
          fi
          npm run db:migrate:deploy

  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [migrate]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_docker_push != 'true'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Redeploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migrate, build-and-push]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_API }}

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Thiếu secret RAILWAY_TOKEN"
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Thiếu secret RAILWAY_SERVICE_API"
            exit 1
          fi
          echo "Railway secrets OK"

      - name: Redeploy BE
        run: |
          echo "Redeploy BE → $RAILWAY_SERVICE"
          railway redeploy --service "$RAILWAY_SERVICE" --yes
